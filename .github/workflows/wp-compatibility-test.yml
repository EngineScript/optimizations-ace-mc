  javascript-tests:
    name: JavaScript Tests (Node 24)
    runs-on: ubuntu-latest
    # The job files an issue when it fails on main.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 15

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        id: setup_php_8_3
        uses: shivammathur/setup-php@v2
        with:
          # PHP renders the template and the store data that the tests load.
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Setup Node.js 24
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install npm dependencies
        id: install_npm_dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ls jsdom underscore

      - name: Run JavaScript tests
        id: run_javascript_tests
        run: |
          mkdir -p "$RUNNER_TEMP/optimizations-ace-mc-diagnostics"
          node --version
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination="$RUNNER_TEMP/optimizations-ace-mc-diagnostics/javascript-tests.tap" \
            "tests/js/**/*.test.mjs"
          # A run that found no tests must not pass.
          grep -Eq '^# pass [1-9]' "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/javascript-tests.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/javascript-tests.tap"
          # This control must fail because of its assertion.
          printf '%s\n' \
            "import assert from 'node:assert/strict';" \
            "import { test } from 'node:test';" \
            "test( 'intentional failure', () => assert.equal( 1, 2, 'JavaScript intentional assertion control' ) );" \
            > "$RUNNER_TEMP/optimizations-ace-mc-intentional-failure.test.mjs"
          if node --test "$RUNNER_TEMP/optimizations-ace-mc-intentional-failure.test.mjs" > "$RUNNER_TEMP/optimizations-ace-mc-intentional-failure.txt" 2>&1; then
            echo '::error::An intentionally failing assertion incorrectly succeeded.'
            exit 1
          fi
          grep -q 'JavaScript intentional assertion control' "$RUNNER_TEMP/optimizations-ace-mc-intentional-failure.txt"
          echo 'Intentional-assertion control failed as expected.'

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php_8_3=${{ steps.setup_php_8_3.outcome }}
            setup_node=${{ steps.setup_node.outcome }}
            install_npm_dependencies=${{ steps.install_npm_dependencies.outcome }}
            run_javascript_tests=${{ steps.run_javascript_tests.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/optimizations-ace-mc-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/run.txt"
          if command -v node >/dev/null; then
            node --version > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/node.txt"
          fi
          if command -v npm >/dev/null && [ -d node_modules ]; then
            npm ls --all --depth=1 > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/dependencies.txt" 2>&1 || true
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type l -delete
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-javascript-tests
          path: |
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/run.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/steps.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/node.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/dependencies.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/javascript-tests.tap
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on JavaScript test failure
        id: create_issue_on_javascript_test_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php_8_3.outcome == 'failure' && 'setup_php_8_3' || steps.setup_node.outcome == 'failure' && 'setup_node' || steps.install_npm_dependencies.outcome == 'failure' && 'install_npm_dependencies' || steps.run_javascript_tests.outcome == 'failure' && 'run_javascript_tests' || 'unknown_or_canceled' }}
          NODE_VERSION: '24'
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/javascript-test-failure.md
          update_existing: false

  wp-version-test:
    name: Test WordPress ${{ matrix.wp-version }} with PHP ${{ matrix.php-version }} (${{ matrix.dependency-versions }} deps)
    runs-on: ubuntu-latest
    # The job files an issue when it fails on main.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    strategy:
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        wp-version: ['7.0', 'latest', 'nightly']
        dependency-versions: ['highest']
        include:
          - php-version: '8.2'
            wp-version: 'latest'
            dependency-versions: 'lowest'
      fail-fast: false

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -proot --silent" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php-version }}
        id: setup_php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, curl, zip, intl, gd, mbstring, fileinfo, xml
          coverage: none
          tools: composer:v2

      - name: Use isolated Composer auth
        id: use_isolated_composer_auth
        run: |
          # Avoid inheriting a masked or malformed GitHub OAuth token from Composer auth.
          composer_home="${RUNNER_TEMP}/composer-home"
          composer_cache="${RUNNER_TEMP}/composer-cache"

          mkdir -p "$composer_home" "$composer_cache"

          {
            echo "COMPOSER_HOME=$composer_home"
            echo "COMPOSER_CACHE_DIR=$composer_cache"
            echo 'COMPOSER_AUTH={"github-oauth":{"github.com":"${{ github.token }}"}}'
          } >> "$GITHUB_ENV"

      - name: PHP syntax lint
        id: php_syntax_lint
        run: |
          find . \
            -path './vendor' -prune -o \
            -path './tests' -prune -o \
            -path './build' -prune -o \
            -path './plugin-check-build' -prune -o \
            -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install Subversion
        id: install_subversion
        timeout-minutes: 15
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install Composer dependencies
        id: install_composer_dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependency-versions }}
          composer-options: "--prefer-dist --no-progress"

      - name: Run unit tests
        id: run_unit_tests
        run: |
          # The tracked unit suite needs no WordPress install. It runs here, on the
          # Composer-resolved PHPUnit and with the tracked phpunit.xml and
          # tests/bootstrap.php, before the next steps pin PHPUnit 9.6 and generate
          # the WordPress integration bootstrap and configuration in their place.
          vendor/bin/phpunit --version
          vendor/bin/phpunit --configuration phpunit.xml --testsuite unit --fail-on-empty-test-suite

      - name: Pin PHPUnit for WordPress test suite
        id: pin_phpunit_for_wordpress_test_suite
        run: |
          # The WordPress test library still calls PHPUnit APIs removed in PHPUnit 10+.
          # Keep this generated integration-test job on PHPUnit 9.6 while the rest
          # of the project can continue using newer Composer-resolved QA tooling.
          if [ "${{ matrix.dependency-versions }}" = "lowest" ]; then
            composer require --dev phpunit/phpunit:"^9.6" yoast/phpunit-polyfills:"^4.0" --with-all-dependencies --prefer-lowest --no-progress
          else
            composer require --dev phpunit/phpunit:"^9.6" yoast/phpunit-polyfills:"^4.0" --with-all-dependencies --no-progress
          fi

      - name: Verify PHPUnit dependency versions
        id: verify_phpunit_dependency_versions
        run: |
          composer show phpunit/phpunit
          composer show yoast/phpunit-polyfills
          vendor/bin/phpunit --version | grep -E '^PHPUnit 9\.6\.'

      - name: Prepare Database
        id: prepare_database
        run: |
          mysql -u root --password=root --host=127.0.0.1 --port=3306 -e "DROP DATABASE IF EXISTS wordpress_test;"
          mysqladmin -u root --password=root --host=127.0.0.1 --port=3306 --force create wordpress_test

      - name: Create tests directory structure
        id: create_tests_directory_structure
        run: |
          mkdir -p tests/bin
          mkdir -p tests/bootstrap

      - name: Create WP tests install script
        id: create_wp_tests_install_script
        run: |
          cat > tests/bin/install-wp-tests.sh << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          set +x
          umask 077

          if [ $# -lt 3 ]; then
            echo "usage: $0 <db-name> <db-user> <db-pass> [db-host] [wp-version] [skip-database-creation]"
            exit 1
          fi

          DB_NAME=$1
          DB_USER=$2
          DB_PASS=$3
          DB_HOST=${4-localhost}
          WP_VERSION=${5-latest}
          SKIP_DB_CREATE=${6-false}

          WP_TESTS_DIR=${WP_TESTS_DIR-/tmp/wordpress-tests-lib}
          WP_CORE_DIR=${WP_CORE_DIR-/tmp/wordpress/}

          # Only the isolated GitHub service database is in scope.
          [[ $DB_NAME == wordpress_test && $DB_HOST == 127.0.0.1:3306 ]]
          [[ $SKIP_DB_CREATE == true || $SKIP_DB_CREATE == false ]]

          download() {
              curl --fail --silent --show-error --location \
                  --proto '=https' --proto-redir '=https' \
                  --connect-timeout 20 --max-time 180 --retry 3 \
                  "$1" --output "$2"
              test -s "$2"
          }

          if [[ $WP_VERSION == latest ]]; then
              download https://api.wordpress.org/core/version-check/1.7/ /tmp/wp-latest.json
              WP_VERSION=$(php -r '
                  $data = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
                  $versions = [];
                  foreach ($data["offers"] ?? [] as $offer) {
                      if (($offer["response"] ?? null) !== "upgrade") {
                          continue;
                      }
                      $version = $offer["current"] ?? null;
                      if (!is_string($version) || !preg_match("/\A[0-9]+\.[0-9]+(?:\.[0-9]+)?\z/", $version)) {
                          throw new RuntimeException("Invalid stable WordPress offer.");
                      }
                      $versions[$version] = true;
                  }
                  if (count($versions) !== 1) {
                      throw new RuntimeException("Expected exactly one stable WordPress release.");
                  }
                  echo array_key_first($versions);
              ' /tmp/wp-latest.json)
          fi

          if [[ $WP_VERSION =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              WP_TESTS_TAG="tags/$WP_VERSION"
          elif [[ $WP_VERSION == nightly || $WP_VERSION == trunk ]]; then
              WP_TESTS_TAG=trunk
          else
              echo "Invalid WordPress version selector" >&2
              exit 1
          fi
          WP_SOURCE_URL="https://develop.svn.wordpress.org/$WP_TESTS_TAG"
          WP_REVISION=$(svn info --non-interactive --show-item revision "$WP_SOURCE_URL")
          [[ $WP_REVISION =~ ^[0-9]+$ ]]

          install_wp() {
              # Do not silently reuse a partial install.
              [[ ! -e $WP_CORE_DIR && ! -L $WP_CORE_DIR ]]
              if [[ $WP_TESTS_TAG == trunk ]]; then
                  # Nightly core and test fixtures use one immutable SVN snapshot.
                  svn export --non-interactive --quiet -r "$WP_REVISION" \
                      "$WP_SOURCE_URL/src@$WP_REVISION" "$WP_CORE_DIR"
              else
                  mkdir -p "$WP_CORE_DIR"
                  download "https://wordpress.org/wordpress-$WP_VERSION.tar.gz" /tmp/wordpress.tar.gz
                  tar --strip-components=1 -zxf /tmp/wordpress.tar.gz -C "$WP_CORE_DIR"
              fi

              # setup-php supplies native mysqli; never fetch a mutable third-party db.php.
              php -r 'exit(extension_loaded("mysqli") ? 0 : 1);'
              test ! -e "$WP_CORE_DIR/wp-content/db.php"
              CORE_VERSION=$(php -r 'require $argv[1]; echo $wp_version;' "$WP_CORE_DIR/wp-includes/version.php")
              SOURCE_VERSION=$(svn cat --non-interactive -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/src/wp-includes/version.php@$WP_REVISION" |
                  php -r '$source = stream_get_contents(STDIN); if (!preg_match("/\\\$wp_version\s*=\s*\x27([^\x27]+)\x27/", $source, $match)) { exit(1); } echo $match[1];')
              [[ ${CORE_VERSION%-src} == "${SOURCE_VERSION%-src}" ]]
              if [[ $WP_TESTS_TAG != trunk ]]; then
                  [[ ${CORE_VERSION%-src} == "$WP_VERSION" ]]
              fi
              mkdir -p "$RUNNER_TEMP/optimizations-ace-mc-diagnostics"
              printf 'core=%s\nsource=%s\nrevision=%s\n' "$CORE_VERSION" "$WP_TESTS_TAG" "$WP_REVISION" \
                  > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/wordpress.txt"
          }

          install_test_suite() {
              [[ ! -e $WP_TESTS_DIR && ! -L $WP_TESTS_DIR ]]
              mkdir -p "$WP_TESTS_DIR"
              svn co --non-interactive --quiet -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/tests/phpunit/includes@$WP_REVISION" "$WP_TESTS_DIR/includes"
              svn co --non-interactive --quiet -r "$WP_REVISION" \
                  "$WP_SOURCE_URL/tests/phpunit/data@$WP_REVISION" "$WP_TESTS_DIR/data"

              if [ ! -f "$WP_TESTS_DIR/wp-tests-config.php" ]; then
                  svn cat --non-interactive -r "$WP_REVISION" \
                      "$WP_SOURCE_URL/wp-tests-config-sample.php@$WP_REVISION" \
                      > "$WP_TESTS_DIR/wp-tests-config.php"
                  export WP_TESTS_DIR WP_CORE_DIR DB_NAME DB_USER DB_PASS DB_HOST
                  # Quote PHP literals safely; do not interpolate credentials through sed.
                  php -r '
                      $path = getenv("WP_TESTS_DIR") . "/wp-tests-config.php";
                      $config = file_get_contents($path);
                      $replacements = [
                          "dirname( __FILE__ ) . \x27/src/\x27" => rtrim(getenv("WP_CORE_DIR"), "/") . "/",
                          "\x27youremptytestdbnamehere\x27" => getenv("DB_NAME"),
                          "\x27yourusernamehere\x27" => getenv("DB_USER"),
                          "\x27yourpasswordhere\x27" => getenv("DB_PASS"),
                          "\x27localhost\x27" => getenv("DB_HOST"),
                      ];
                      foreach ($replacements as $needle => $value) {
                          if (substr_count($config, $needle) !== 1) {
                              throw new RuntimeException("Unexpected WordPress test config template.");
                          }
                          $config = str_replace($needle, var_export($value, true), $config);
                      }
                      if (file_put_contents($path, $config) !== strlen($config)) {
                          throw new RuntimeException("Cannot write WordPress test config.");
                      }
                  '
              fi
          }

          install_db() {
              if [[ $SKIP_DB_CREATE == true ]]; then
                  return
              fi
              # Fallback is limited to this job's disposable service and never drops a DB.
              MYSQL_PWD="$DB_PASS" mysql --user="$DB_USER" --host=127.0.0.1 --port=3306 \
                  -e 'CREATE DATABASE wordpress_test'
          }

          install_wp
          install_test_suite
          install_db
          EOF
          chmod +x tests/bin/install-wp-tests.sh

      - name: Create Bootstrap File
        id: create_bootstrap_file
        run: |
          mkdir -p tests
          cat > tests/bootstrap.php << 'EOF'
          <?php
          /**
           * PHPUnit bootstrap file for plugin tests.
           *
           * @package OptimizationsAceMc
           */

          define( 'WP_TESTS_PHPUNIT_POLYFILLS_PATH', dirname( __DIR__ ) . '/vendor/yoast/phpunit-polyfills' );
          require_once '/tmp/wordpress-tests-lib/includes/functions.php';

          function _manually_load_plugin() {
              add_filter('widgets_init', function() {
                  return;
              }, 0);

              require dirname( dirname( __FILE__ ) ) . '/optimizations-ace-mc.php';
          }

          tests_add_filter( 'muplugins_loaded', '_manually_load_plugin' );

          require '/tmp/wordpress-tests-lib/includes/bootstrap.php';
          EOF

      - name: Create Test File
        id: create_test_file
        run: |
          # The generated suite lives in tests/integration so that the WordPress
          # configuration below does not pick up the tracked tests/unit suite,
          # which defines its own stand-ins for WordPress functions.
          mkdir -p tests/integration
          cat > tests/integration/OptimizationsAceMcTest.php << 'EOF'
          <?php
          /**
           * Class OptimizationsAceMcTest
           *
           * @package OptimizationsAceMc
           */

          class OptimizationsAceMcTest extends WP_UnitTestCase {
              private const OPTION = 'optimizations_ace_mc_settings';

              private const KEYS = [
                  'woocommerce_show_empty_categories',
                  'woocommerce_hide_category_count',
                  'woocommerce_user_order_count_column',
                  'wpsl_show_store_categories',
                  'wpsl_disable_rest_api',
                  'admin_user_registration_date_column',
              ];

              public function tear_down() {
                  delete_option(self::OPTION);
                  unregister_setting('optimizations_ace_mc_group', self::OPTION);
                  wp_dequeue_style('optimizations-ace-mc-admin');
                  wp_deregister_style('optimizations-ace-mc-admin');
                  foreach (['wpsl_stores' => 'unregister_post_type', 'wpsl_store_category' => 'unregister_taxonomy'] as $name => $unregister) {
                      if ('wpsl_stores' === $name ? post_type_exists($name) : taxonomy_exists($name)) {
                          $unregister($name);
                      }
                  }
                  unset(
                      $GLOBALS['wp_settings_sections']['optimizations-ace-mc'],
                      $GLOBALS['wp_settings_fields']['optimizations-ace-mc'],
                      $GLOBALS['submenu']['options-general.php'],
                      $GLOBALS['title']
                  );
                  unset($GLOBALS['current_screen']);
                  wp_set_current_user(0);
                  parent::tear_down();
              }

              private function settings_with(array $stored): Optimizations_Ace_Mc_Settings {
                  update_option(self::OPTION, $stored);
                  return new Optimizations_Ace_Mc_Settings();
              }

              private function use_admin_screen(): void {
                  require_once ABSPATH . 'wp-admin/includes/admin.php';
                  set_current_screen('users');
                  $this->assertTrue(is_admin());
              }

              private function all_off(): array {
                  return array_fill_keys(self::KEYS, false);
              }

              public function test_plugin_loaded() {
                  $this->assertTrue(class_exists('Optimizations_Ace_Mc'), 'Plugin was not loaded correctly');
                  $this->assertInstanceOf(Optimizations_Ace_Mc::class, optimizations_ace_mc());
                  $this->assertSame(10, has_action('plugins_loaded', 'optimizations_ace_mc_init'));
              }

              public function test_plugin_constants_defined() {
                  $this->assertTrue(defined('OPTIMIZATIONS_ACE_MC_VERSION'));
                  $this->assertNotEmpty(OPTIMIZATIONS_ACE_MC_VERSION);
                  $this->assertTrue(defined('OPTIMIZATIONS_ACE_MC_PLUGIN_FILE'));
                  $this->assertFileExists(OPTIMIZATIONS_ACE_MC_PLUGIN_FILE);
                  // Legacy constants removed in the 1.6.0 review (LEG-01).
                  $this->assertFalse(defined('OPTIMIZATIONS_ACE_MC_PLUGIN_DIR'));
                  $this->assertFalse(defined('OPTIMIZATIONS_ACE_MC_PLUGIN_URL'));
              }

              public function test_plugin_header_declares_requirements() {
                  $headers = get_file_data(OPTIMIZATIONS_ACE_MC_PLUGIN_FILE, [
                      'requires_plugins' => 'Requires Plugins',
                      'requires_wp'      => 'Requires at least',
                      'requires_php'     => 'Requires PHP',
                  ]);
                  $this->assertSame('woocommerce', $headers['requires_plugins']);
                  $this->assertSame('7.0', $headers['requires_wp']);
                  $this->assertSame('8.2', $headers['requires_php']);
              }

              public function test_every_setting_defaults_off() {
                  delete_option(self::OPTION);
                  $settings = new Optimizations_Ace_Mc_Settings();
                  $this->assertSame($this->all_off(), $settings->defaults());
                  foreach (self::KEYS as $key) {
                      $this->assertFalse($settings->is_enabled($key), $key);
                  }
              }

              public function test_disabled_features_register_no_hooks() {
                  $settings = $this->settings_with([]);
                  $this->use_admin_screen();
                  $admin = new Optimizations_Ace_Mc_Admin_Optimizations($settings);
                  $wpsl  = new Optimizations_Ace_Mc_Wpsl_Optimizations($settings);
                  $admin->register_hooks();
                  $wpsl->register_hooks();
                  ( new Optimizations_Ace_Mc_WooCommerce_Optimizations($settings) )->register_hooks();
                  $this->assertFalse(has_filter('woocommerce_product_subcategories_hide_empty'));
                  $this->assertFalse(has_filter('woocommerce_subcategory_count_html'));
                  $this->assertFalse(has_filter('manage_users_columns', [$admin, 'add_user_registration_date_column']));
                  $this->assertFalse(has_filter('wpsl_store_meta', [$wpsl, 'add_store_categories_to_meta']));
                  $this->assertFalse(has_filter('wpsl_post_type_args', [$wpsl, 'disable_store_locator_rest_api']));
              }

              public function test_enabled_features_register_hooks() {
                  $settings = $this->settings_with(array_fill_keys(self::KEYS, true));
                  $this->use_admin_screen();
                  $admin = new Optimizations_Ace_Mc_Admin_Optimizations($settings);
                  $wpsl  = new Optimizations_Ace_Mc_Wpsl_Optimizations($settings);
                  $admin->register_hooks();
                  $wpsl->register_hooks();
                  ( new Optimizations_Ace_Mc_WooCommerce_Optimizations($settings) )->register_hooks();
                  $this->assertSame(10, has_filter('woocommerce_product_subcategories_hide_empty', '__return_false'));
                  $this->assertSame(10, has_filter('woocommerce_subcategory_count_html', '__return_false'));
                  $this->assertSame(10, has_filter('manage_users_columns', [$admin, 'add_user_registration_date_column']));
                  $this->assertSame(10, has_filter('manage_users_sortable_columns', [$admin, 'make_user_registration_date_sortable']));
                  $this->assertSame(10, has_filter('wpsl_store_meta', [$wpsl, 'add_store_categories_to_meta']));
                  $this->assertSame(10, has_filter('wpsl_post_type_args', [$wpsl, 'disable_store_locator_rest_api']));
              }

              public function test_order_count_column_skipped_without_woocommerce() {
                  $this->assertFalse(function_exists('wc_get_customer_order_count'), 'WooCommerce must not be loaded in this suite');
                  $settings = $this->settings_with(['woocommerce_user_order_count_column' => true]);
                  $this->use_admin_screen();
                  $wc = new Optimizations_Ace_Mc_WooCommerce_Optimizations($settings);
                  $wc->register_hooks();
                  $this->assertTrue($settings->is_enabled('woocommerce_user_order_count_column'));
                  $this->assertFalse(has_filter('manage_users_columns', [$wc, 'add_user_order_count_column']));
                  $this->assertFalse(has_filter('manage_users_custom_column', [$wc, 'display_user_order_count_column']));
              }

              public function test_settings_save_normalizes_any_input() {
                  require_once ABSPATH . 'wp-admin/includes/template.php';
                  ( new Optimizations_Ace_Mc_Admin_Page(new Optimizations_Ace_Mc_Settings()) )->register_settings();
                  foreach ([null, '', 'x', 0, ['unknown' => '1', 'wpsl_disable_rest_api' => ['1']]] as $input) {
                      update_option(self::OPTION, ['wpsl_disable_rest_api' => '1']);
                      update_option(self::OPTION, $input);
                      $this->assertSame($this->all_off(), get_option(self::OPTION));
                  }
                  update_option(self::OPTION, ['wpsl_disable_rest_api' => '1', 'woocommerce_hide_category_count' => 'on']);
                  $stored = get_option(self::OPTION);
                  $this->assertSame(self::KEYS, array_keys($stored));
                  $this->assertTrue($stored['wpsl_disable_rest_api']);
                  $this->assertTrue($stored['woocommerce_hide_category_count']);
                  $this->assertFalse($stored['admin_user_registration_date_column']);
              }

              public function test_registration_date_column_formats_and_rejects_zero_dates() {
                  global $wpdb;
                  update_option('date_format', 'Y-m-d');
                  update_option('time_format', 'H:i');
                  update_option('timezone_string', 'UTC');
                  $user_id = self::factory()->user->create();
                  $wpdb->update($wpdb->users, ['user_registered' => '2024-03-05 14:30:00'], ['ID' => $user_id]);
                  clean_user_cache($user_id);
                  $admin = new Optimizations_Ace_Mc_Admin_Optimizations(new Optimizations_Ace_Mc_Settings());
                  $this->assertSame('2024-03-05 14:30', $admin->display_user_registration_date_column('', 'registration_date', $user_id));
                  $wpdb->update($wpdb->users, ['user_registered' => '0000-00-00 00:00:00'], ['ID' => $user_id]);
                  clean_user_cache($user_id);
                  $this->assertSame('Unknown', $admin->display_user_registration_date_column('', 'registration_date', $user_id));
                  $this->assertSame('Unknown', $admin->display_user_registration_date_column('', 'registration_date', 999999999));
              }

              public function test_shared_filters_pass_through_foreign_values() {
                  $settings = new Optimizations_Ace_Mc_Settings();
                  $admin    = new Optimizations_Ace_Mc_Admin_Optimizations($settings);
                  $wc       = new Optimizations_Ace_Mc_WooCommerce_Optimizations($settings);
                  $wpsl     = new Optimizations_Ace_Mc_Wpsl_Optimizations($settings);
                  $this->assertNull($admin->display_user_registration_date_column(null, 'other', 1));
                  $this->assertSame('x', $wc->display_user_order_count_column('x', 'other', 1));
                  $this->assertNull($admin->add_user_registration_date_column(null));
                  $this->assertNull($admin->make_user_registration_date_sortable(null));
                  $this->assertNull($wc->add_user_order_count_column(null));
                  $this->assertNull($wpsl->disable_store_locator_rest_api(null));
                  $this->assertFalse($wpsl->disable_store_locator_rest_api(['show_in_rest' => true])['show_in_rest']);
              }

              public function test_uninstall_is_registered_and_deletes_settings() {
                  $registry = (array) get_option('uninstall_plugins');
                  $this->assertSame(
                      ['Optimizations_Ace_Mc_Settings', 'uninstall'],
                      $registry[plugin_basename(OPTIMIZATIONS_ACE_MC_PLUGIN_FILE)] ?? null
                  );
                  update_option(self::OPTION, ['wpsl_disable_rest_api' => true]);
                  Optimizations_Ace_Mc_Settings::uninstall();
                  $this->assertFalse(get_option(self::OPTION));
              }

              public function test_unserializing_coordinator_is_blocked() {
                  $this->expectException(LogicException::class);
                  unserialize('O:20:"Optimizations_Ace_Mc":0:{}');
              }

              public function test_checkbox_markup_uses_one_label_and_description() {
                  $page = new Optimizations_Ace_Mc_Admin_Page(new Optimizations_Ace_Mc_Settings());
                  ob_start();
                  $page->checkbox_field_callback(['label_for' => 'wpsl_disable_rest_api']);
                  $html = ob_get_clean();
                  $this->assertStringNotContainsString('<label', $html);
                  $this->assertStringContainsString('aria-describedby="wpsl_disable_rest_api-description"', $html);
                  $this->assertStringContainsString('id="wpsl_disable_rest_api-description"', $html);
                  ob_start();
                  $page->checkbox_field_callback(['label_for' => 'unknown_setting']);
                  $this->assertSame('', ob_get_clean());
              }

              public function test_settings_page_renders_for_administrators_only() {
                  require_once ABSPATH . 'wp-admin/includes/admin.php';
                  $GLOBALS['title'] = 'ACE MC Optimizations';
                  $page = new Optimizations_Ace_Mc_Admin_Page($this->settings_with(['wpsl_disable_rest_api' => '1']));
                  $page->register_settings();
                  wp_set_current_user(self::factory()->user->create(['role' => 'administrator']));
                  ob_start();
                  $page->render();
                  $html = ob_get_clean();
                  $this->assertStringContainsString('action="options.php"', $html);
                  // Printed by WordPress: the option group and the nonce that options.php checks.
                  $this->assertMatchesRegularExpression('/name=.option_page. value=.optimizations_ace_mc_group./', $html);
                  $this->assertStringContainsString('name="_wpnonce"', $html);
                  foreach (self::KEYS as $key) {
                      $this->assertSame(1, substr_count($html, 'name="' . self::OPTION . '[' . $key . ']"'), $key);
                      $this->assertSame(1, substr_count($html, '<label for="' . $key . '">'), $key);
                  }
                  $this->assertSame(1, substr_count($html, "checked='checked'"));
                  $this->assertMatchesRegularExpression('/<input[^>]+id="wpsl_disable_rest_api"[^>]+checked=/', $html);
                  wp_set_current_user(self::factory()->user->create(['role' => 'subscriber']));
                  $this->expectException(WPDieException::class);
                  $page->render();
              }

              public function test_menu_entry_and_stylesheet_belong_to_the_settings_screen() {
                  require_once ABSPATH . 'wp-admin/includes/admin.php';
                  wp_set_current_user(self::factory()->user->create(['role' => 'administrator']));
                  $page = new Optimizations_Ace_Mc_Admin_Page(new Optimizations_Ace_Mc_Settings());
                  $page->add_admin_menu();
                  $entries = array_values(array_filter(
                      $GLOBALS['submenu']['options-general.php'] ?? [],
                      static fn($entry) => 'optimizations-ace-mc' === $entry[2]
                  ));
                  $this->assertCount(1, $entries);
                  $this->assertSame('manage_options', $entries[0][1]);
                  $hook = get_plugin_page_hookname('optimizations-ace-mc', 'options-general.php');
                  $this->assertSame(10, has_action($hook, [$page, 'render']));
                  $page->enqueue_admin_styles('index.php');
                  $page->enqueue_admin_styles('options-general.php');
                  $this->assertFalse(wp_style_is('optimizations-ace-mc-admin', 'enqueued'));
                  $page->enqueue_admin_styles($hook);
                  $this->assertTrue(wp_style_is('optimizations-ace-mc-admin', 'enqueued'));
                  $style = wp_styles()->registered['optimizations-ace-mc-admin'];
                  $this->assertSame(plugins_url('assets/css/admin.css', OPTIMIZATIONS_ACE_MC_PLUGIN_FILE), $style->src);
                  $this->assertSame(OPTIMIZATIONS_ACE_MC_VERSION, $style->ver);
              }

              public function test_store_categories_come_from_the_terms_of_the_store() {
                  register_taxonomy('wpsl_store_category', 'post');
                  $store = self::factory()->post->create();
                  $terms = [];
                  foreach (['Sales & Service', 'Certified Installer'] as $name) {
                      $terms[] = self::factory()->term->create(['taxonomy' => 'wpsl_store_category', 'name' => $name]);
                  }
                  wp_set_object_terms($store, $terms, 'wpsl_store_category');
                  $wpsl = new Optimizations_Ace_Mc_Wpsl_Optimizations(new Optimizations_Ace_Mc_Settings());
                  $this->assertSame(
                      ['store' => 'kept', 'terms' => 'Certified Installer, Sales &amp; Service'],
                      $wpsl->add_store_categories_to_meta(['store' => 'kept'], $store)
                  );
                  $this->assertSame(['terms' => ''], $wpsl->add_store_categories_to_meta([], self::factory()->post->create()));
                  // Without the taxonomy the term lookup returns a WP_Error.
                  unregister_taxonomy('wpsl_store_category');
                  $uncached = self::factory()->post->create();
                  $this->assertWPError(get_the_terms($uncached, 'wpsl_store_category'));
                  $this->assertSame(['terms' => ''], $wpsl->add_store_categories_to_meta([], $uncached));
              }

              public function test_rest_switch_takes_the_store_post_type_out_of_rest() {
                  $register = static function () {
                      return register_post_type('wpsl_stores', apply_filters('wpsl_post_type_args', ['public' => true, 'show_in_rest' => true]));
                  };
                  $this->assertTrue($register()->show_in_rest);
                  unregister_post_type('wpsl_stores');
                  (new Optimizations_Ace_Mc_Wpsl_Optimizations($this->settings_with(['wpsl_disable_rest_api' => '1'])))->register_hooks();
                  $type = $register();
                  $this->assertFalse($type->show_in_rest);
                  $this->assertTrue($type->public);
                  $this->assertNotContains('wpsl_stores', get_post_types(['show_in_rest' => true]));
              }

              public function test_registration_date_is_shown_in_the_site_time_zone() {
                  global $wpdb;
                  update_option('date_format', 'Y-m-d');
                  update_option('time_format', 'H:i');
                  update_option('timezone_string', 'Europe/Amsterdam');
                  $user_id = self::factory()->user->create();
                  $wpdb->update($wpdb->users, ['user_registered' => '2024-01-15 23:30:00'], ['ID' => $user_id]);
                  clean_user_cache($user_id);
                  $admin = new Optimizations_Ace_Mc_Admin_Optimizations(new Optimizations_Ace_Mc_Settings());
                  $this->assertSame('2024-01-16 00:30', $admin->display_user_registration_date_column('', 'registration_date', $user_id));
              }

              public function test_info_window_template_gains_guarded_categories() {
                  (new Optimizations_Ace_Mc_Wpsl_Optimizations($this->settings_with(['wpsl_show_store_categories' => '1'])))->register_hooks();
                  $template = "<div class=\"wpsl-info-window\">\r\n\t<p><%= store %></p>\r\n\t<%= createInfoWindowActions( id ) %>\r\n</div>";
                  $filtered = apply_filters('wpsl_info_window_template', $template);
                  // Store data cached before the setting was enabled has no "terms" value.
                  $this->assertStringContainsString('<% if ( typeof terms !== "undefined" && terms ) { %>', $filtered);
                  $this->assertLessThan(strpos($filtered, 'createInfoWindowActions'), strpos($filtered, '<%= terms %>'));
                  $this->assertSame($template, preg_replace('/\t<% if \( typeof terms.*?<% \} %>\r\n/s', '', $filtered));
                  $this->assertSame(['terms' => ''], apply_filters('wpsl_store_meta', [], 0));
                  $this->assertNull(apply_filters('wpsl_store_meta', null, 0));
              }

              public function test_changing_the_category_setting_drops_the_store_locator_cache() {
                  if (!function_exists('wpsl_flush_store_cache')) {
                      function wpsl_flush_store_cache() {
                          ++$GLOBALS['optimizations_ace_mc_test_flushes'];
                      }
                  }
                  $GLOBALS['optimizations_ace_mc_test_flushes'] = 0;
                  $this->use_admin_screen();
                  (new Optimizations_Ace_Mc_Wpsl_Optimizations(new Optimizations_Ace_Mc_Settings()))->register_hooks();
                  $on = ['wpsl_show_store_categories' => true] + $this->all_off();
                  add_option(self::OPTION, $this->all_off());
                  $this->assertSame(0, $GLOBALS['optimizations_ace_mc_test_flushes'], 'First save with the setting off');
                  update_option(self::OPTION, $on);
                  $this->assertSame(1, $GLOBALS['optimizations_ace_mc_test_flushes'], 'Setting turned on');
                  update_option(self::OPTION, ['wpsl_disable_rest_api' => true] + $on);
                  $this->assertSame(1, $GLOBALS['optimizations_ace_mc_test_flushes'], 'Another setting changed');
                  update_option(self::OPTION, $this->all_off());
                  $this->assertSame(2, $GLOBALS['optimizations_ace_mc_test_flushes'], 'Setting turned off');
                  delete_option(self::OPTION);
                  add_option(self::OPTION, $on);
                  $this->assertSame(3, $GLOBALS['optimizations_ace_mc_test_flushes'], 'First save with the setting on');
              }

              public function test_wordpress_version_compatibility() {
                  global $wp_version;
                  $this->assertNotEmpty($wp_version, 'WordPress version should be available');

                  // Test that we're running on a supported WordPress version
                  $min_wp_version = '7.0';
                  $this->assertTrue(version_compare(preg_replace('/-src$/', '', $wp_version), $min_wp_version, '>='),
                      "WordPress version {$wp_version} should be >= {$min_wp_version}");
              }
          }
          EOF

      - name: Create PHPUnit Config
        id: create_phpunit_config
        run: |
          cat > phpunit.xml << 'EOF'
          <?xml version="1.0"?>
          <phpunit
              bootstrap="tests/bootstrap.php"
              backupGlobals="false"
              colors="true"
              failOnEmptyTestSuite="true"
              failOnRisky="true"
              failOnWarning="true"
          >
              <testsuites>
                  <testsuite name="Optimizations ACE MC">
                      <directory suffix="Test.php">./tests/integration/</directory>
                  </testsuite>
              </testsuites>
          </phpunit>
          EOF

      - name: Setup WP Tests
        id: setup_wp_tests
        timeout-minutes: 15
        run: |
          bash tests/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp-version }} true

      - name: Run plugin test
        id: run_plugin_test
        run: |
          mkdir -p "$RUNNER_TEMP/optimizations-ace-mc-diagnostics"
          vendor/bin/phpunit --config phpunit.xml --log-junit "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/junit.xml"
          # Prove that the real generated config rejects an empty filtered suite.
          if vendor/bin/phpunit --config phpunit.xml --do-not-cache-result \
            --filter '__optimizations_ace_mc_intentionally_no_matching_test__' \
            > "$RUNNER_TEMP/optimizations-ace-mc-empty-suite.txt" 2>&1; then
            echo '::error::An empty test suite incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'No tests executed' "$RUNNER_TEMP/optimizations-ace-mc-empty-suite.txt"
          fi
          # This control must fail due to its assertion, not a setup/parse error.
          cat > "$RUNNER_TEMP/OptimizationsAceMcIntentionalFailureTest.php" << 'EOF'
          <?php
          final class OptimizationsAceMcIntentionalFailureTest extends PHPUnit\Framework\TestCase {
              public function test_intentional_failure(): void {
                  $this->assertTrue(false, 'Optimizations ACE MC intentional assertion control');
              }
          }
          EOF
          if vendor/bin/phpunit --no-configuration --do-not-cache-result \
            "$RUNNER_TEMP/OptimizationsAceMcIntentionalFailureTest.php" \
            > "$RUNNER_TEMP/optimizations-ace-mc-failing-suite.txt" 2>&1; then
            echo '::error::An intentionally failing assertion incorrectly succeeded.'
            exit 1
          else
            status=$?
            [[ $status == 1 ]]
            grep -q 'Optimizations ACE MC intentional assertion control' "$RUNNER_TEMP/optimizations-ace-mc-failing-suite.txt"
          fi
          echo 'Empty-suite and intentional-assertion controls failed as expected.'

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php=${{ steps.setup_php.outcome }}
            use_isolated_composer_auth=${{ steps.use_isolated_composer_auth.outcome }}
            php_syntax_lint=${{ steps.php_syntax_lint.outcome }}
            install_subversion=${{ steps.install_subversion.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            run_unit_tests=${{ steps.run_unit_tests.outcome }}
            pin_phpunit_for_wordpress_test_suite=${{ steps.pin_phpunit_for_wordpress_test_suite.outcome }}
            verify_phpunit_dependency_versions=${{ steps.verify_phpunit_dependency_versions.outcome }}
            prepare_database=${{ steps.prepare_database.outcome }}
            create_tests_directory_structure=${{ steps.create_tests_directory_structure.outcome }}
            create_wp_tests_install_script=${{ steps.create_wp_tests_install_script.outcome }}
            create_bootstrap_file=${{ steps.create_bootstrap_file.outcome }}
            create_test_file=${{ steps.create_test_file.outcome }}
            create_phpunit_config=${{ steps.create_phpunit_config.outcome }}
            setup_wp_tests=${{ steps.setup_wp_tests.outcome }}
            run_plugin_test=${{ steps.run_plugin_test.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/optimizations-ace-mc-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type l -delete
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-${{ matrix.php-version }}-${{ matrix.wp-version }}-${{ matrix.dependency-versions }}
          path: |
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/run.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/steps.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/php.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/dependencies.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/wordpress.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Report test status
        id: report_test_status
        if: ${{ always() }}
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Tests passed successfully on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          else
            echo "❌ Tests failed on PHP ${{ matrix.php-version }} with WordPress ${{ matrix.wp-version }}"
          fi

      - name: Ensure repository files available after failure
        id: ensure_repository_files_available_after_failure
        if: ${{ failure() }}
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create issue on test failure
        id: create_issue_on_test_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php.outcome == 'failure' && 'setup_php' || steps.use_isolated_composer_auth.outcome == 'failure' && 'use_isolated_composer_auth' || steps.php_syntax_lint.outcome == 'failure' && 'php_syntax_lint' || steps.install_subversion.outcome == 'failure' && 'install_subversion' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.run_unit_tests.outcome == 'failure' && 'run_unit_tests' || steps.pin_phpunit_for_wordpress_test_suite.outcome == 'failure' && 'pin_phpunit_for_wordpress_test_suite' || steps.verify_phpunit_dependency_versions.outcome == 'failure' && 'verify_phpunit_dependency_versions' || steps.prepare_database.outcome == 'failure' && 'prepare_database' || steps.create_tests_directory_structure.outcome == 'failure' && 'create_tests_directory_structure' || steps.create_wp_tests_install_script.outcome == 'failure' && 'create_wp_tests_install_script' || steps.create_bootstrap_file.outcome == 'failure' && 'create_bootstrap_file' || steps.create_test_file.outcome == 'failure' && 'create_test_file' || steps.create_phpunit_config.outcome == 'failure' && 'create_phpunit_config' || steps.setup_wp_tests.outcome == 'failure' && 'setup_wp_tests' || steps.run_plugin_test.outcome == 'failure' && 'run_plugin_test' || steps.report_test_status.outcome == 'failure' && 'report_test_status' || steps.ensure_repository_files_available_after_failure.outcome == 'failure' && 'ensure_repository_files_available_after_failure' || 'unknown_or_canceled' }}
          PHP_VERSION: ${{ matrix.php-version }}
          WP_VERSION: ${{ matrix.wp-version }}
          DEPENDENCY_VERSIONS: ${{ matrix.dependency-versions }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/wp-version-test-failure.md
          update_existing: false
