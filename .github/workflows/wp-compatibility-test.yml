# This workflow performs comprehensive WordPress plugin compatibility and quality checks.
# It runs multiple validation processes including:
# - WordPress Plugin Check for WordPress.org compatibility
# - PHPUnit tests across supported PHP versions (8.2, 8.3, 8.4, 8.5)
# - PHP compatibility testing across multiple PHP versions (8.2, 8.3, 8.4, 8.5)
# - WordPress compatibility testing across multiple WP versions (7.0, latest, nightly)
# - PHPStan static analysis for WordPress-specific code quality
# - WordPress security vulnerability scanning using pattern analysis
# - PHPCS code standards validation for WordPress coding standards
# - Code quality analysis and automated issue creation for failures
# The workflow ensures the plugin meets WordPress.org standards and maintains compatibility.

name: WordPress Compatibility & Plugin Check

on:
  # Run on pushes to main branch and on all pull requests
  push:
    branches: [ main ]
  pull_request:
  # Allow manually triggering the workflow
  workflow_dispatch:

# Cancels all previous workflow runs for the same branch that have not yet completed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-check:
    name: WP Plugin Check (PHP 8.3)
    runs-on: ubuntu-latest
    # The job files an issue when it fails on main.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45

    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Always fetch the latest commit, disable any caching
          fetch-depth: 0
          clean: true

      - name: Setup PHP 8.3
        id: setup_php_8_3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, zip, intl, gd, mbstring, fileinfo, xml
          coverage: none
          tools: composer:v2

      - name: Clear any existing composer cache
        id: clear_any_existing_composer_cache
        run: |
          composer clear-cache || true
          rm -rf vendor/ composer.lock || true

      - name: Install Composer dependencies (no cache)
        id: install_composer_dependencies_no_cache
        run: |
          composer install --prefer-dist --no-progress --no-cache

      - name: Clean up potential artifact directories
        id: clean_up_potential_artifact_directories
        run: |
          echo "🧹 Removing any artifact directories to prevent conflicts..."
          rm -rf .reports 2>/dev/null || true
          rm -rf build 2>/dev/null || true
          echo "✅ Cleanup complete"

      - name: Prepare Plugin Check build directory
        id: prepare_plugin_check_build_directory
        run: |
          # Stdlib-only automation fixtures run on this runner, not the workstation.
          python3 .github/scripts/test-automation.py
          rm -rf plugin-check-build 2>/dev/null || true

          PLUGIN_SLUG="optimizations-ace-mc"
          BUILD_DIR="plugin-check-build/${PLUGIN_SLUG}"

          mkdir -p "$BUILD_DIR"

          cp optimizations-ace-mc.php "$BUILD_DIR/"
          cp readme.txt "$BUILD_DIR/"
          cp LICENSE "$BUILD_DIR/"
          cp -r includes "$BUILD_DIR/"
          cp -r assets "$BUILD_DIR/"
          cp -r languages "$BUILD_DIR/"
          # Inspect a release-shaped ZIP without publishing or changing the PCP input.
          PACKAGE_ZIP="$RUNNER_TEMP/${PLUGIN_SLUG}-candidate.zip"
          rm -f "$PACKAGE_ZIP"
          (cd plugin-check-build && zip -qr "$PACKAGE_ZIP" "$PLUGIN_SLUG")
          python3 .github/scripts/check-plugin-package.py "$BUILD_DIR" --zip "$PACKAGE_ZIP"

      - name: WordPress Plugin Check
        id: wordpress_plugin_check
        uses: WordPress/plugin-check-action@v1.1.9
        with:
          # Comment only on trusted, same-repository human PRs. An empty token
          # skips the action's optional comment, not checks or annotations.
          repo-token: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' && github.token || '' }}
          # Production-style plugin directory. Excludes repo-only files such as
          # .github, GEMINI.md, and other development artifacts.
          build-dir: './plugin-check-build/optimizations-ace-mc'

          # Configure which categories to check
          categories: |
            accessibility
            general
            performance
            plugin_repo
            security

          # Whether to include experimental checks
          include-experimental: false

          # Don't ignore warnings or errors
          ignore-warnings: false
          ignore-errors: false

          # WordPress version to use
          wp-version: 'latest'

      - name: Handle plugin check completion
        id: handle_plugin_check_completion
        if: ${{ always() }}
        run: |
          echo "Plugin Check job status: ${{ job.status }}"

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php_8_3=${{ steps.setup_php_8_3.outcome }}
            clear_any_existing_composer_cache=${{ steps.clear_any_existing_composer_cache.outcome }}
            install_composer_dependencies_no_cache=${{ steps.install_composer_dependencies_no_cache.outcome }}
            clean_up_potential_artifact_directories=${{ steps.clean_up_potential_artifact_directories.outcome }}
            prepare_plugin_check_build_directory=${{ steps.prepare_plugin_check_build_directory.outcome }}
            wordpress_plugin_check=${{ steps.wordpress_plugin_check.outcome }}
            handle_plugin_check_completion=${{ steps.handle_plugin_check_completion.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/optimizations-ace-mc-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type l -delete
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-plugin-check
          path: |
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/run.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/steps.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/php.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/dependencies.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/wordpress.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on plugin check failure
        id: create_issue_on_plugin_check_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php_8_3.outcome == 'failure' && 'setup_php_8_3' || steps.clear_any_existing_composer_cache.outcome == 'failure' && 'clear_any_existing_composer_cache' || steps.install_composer_dependencies_no_cache.outcome == 'failure' && 'install_composer_dependencies_no_cache' || steps.clean_up_potential_artifact_directories.outcome == 'failure' && 'clean_up_potential_artifact_directories' || steps.prepare_plugin_check_build_directory.outcome == 'failure' && 'prepare_plugin_check_build_directory' || steps.wordpress_plugin_check.outcome == 'failure' && 'wordpress_plugin_check' || steps.handle_plugin_check_completion.outcome == 'failure' && 'handle_plugin_check_completion' || 'unknown_or_canceled' }}
          PHP_VERSION: '8.3'
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/plugin-check-failure.md
          update_existing: false

      - name: Mark job as failed after issue creation
        id: mark_job_as_failed_after_issue_creation
        if: ${{ failure() }}
        run: |
          echo "::error::Plugin Check job failed; see the failed step and reporting outcome."
          exit 1

  phpcs:
    name: PHPCS (PHP 8.3)
    runs-on: ubuntu-latest
    # The job files an issue when it fails on main.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        id: setup_php_8_3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, zip, intl, gd, mbstring, fileinfo, xml
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        id: install_composer_dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: "--prefer-dist --no-progress"

      - name: Verify PHPCS standards
        id: verify_phpcs_standards
        run: |
          # Verify the project-local PHPCS installation and registered standards.
          vendor/bin/phpcs -i

      - name: Run PHPCS
        id: run_phpcs
        run: |
          vendor/bin/phpcs --standard=phpcs.xml

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php_8_3=${{ steps.setup_php_8_3.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            verify_phpcs_standards=${{ steps.verify_phpcs_standards.outcome }}
            run_phpcs=${{ steps.run_phpcs.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/optimizations-ace-mc-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type l -delete
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-phpcs
          path: |
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/run.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/steps.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/php.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/dependencies.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/wordpress.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on PHPCS failure
        id: create_issue_on_phpcs_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php_8_3.outcome == 'failure' && 'setup_php_8_3' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.verify_phpcs_standards.outcome == 'failure' && 'verify_phpcs_standards' || steps.run_phpcs.outcome == 'failure' && 'run_phpcs' || 'unknown_or_canceled' }}
          PHP_VERSION: '8.3'
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/phpcs-failure.md
          update_existing: false

  vip-phpcs:
    name: WP VIP CS (PHP 8.3)
    runs-on: ubuntu-latest
    # The job files an issue when it fails on main.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP 8.3
        id: setup_php_8_3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, zip, intl, gd, mbstring, fileinfo, xml
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        id: install_composer_dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: "--prefer-dist --no-progress"

      - name: Install WordPress VIP Coding Standards
        id: install_wordpress_vip_coding_standards
        run: |
          # Install PHPCS and WordPress VIP Coding Standards
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev squizlabs/php_codesniffer:"^3.13.6"
          composer global require --dev wp-coding-standards/wpcs:"^3.4.1"
          composer global require --dev automattic/vipwpcs:"^3.0.1"
          composer global require --dev dealerdirect/phpcodesniffer-composer-installer:"^1.2"

          # Add composer bin to PATH
          VIP_BIN_DIR="$(composer global config bin-dir --absolute)"
          echo "$VIP_BIN_DIR" >> "$GITHUB_PATH"
          echo "VIP_PHPCS=$VIP_BIN_DIR/phpcs" >> "$GITHUB_ENV"
          export PATH="$VIP_BIN_DIR:$PATH"

          # Verify installation and show available standards
          "$VIP_BIN_DIR/phpcs" -i

          # Verify VIP standards are available
          "$VIP_BIN_DIR/phpcs" -i | grep -F WordPress-VIP-Go

      - name: Create VIP-specific PHPCS configuration
        id: create_vip_specific_phpcs_configuration
        run: |
          cat > phpcs-vip.xml << 'EOF'
          <?xml version="1.0"?>
          <ruleset name="WordPress VIP Go Coding Standards">
              <description>WordPress VIP Go coding standards for enterprise-level WordPress development</description>

              <!-- Files to check -->
              <file>.</file>

              <!-- Exclude patterns -->
              <exclude-pattern>*/vendor/*</exclude-pattern>
              <exclude-pattern>*/node_modules/*</exclude-pattern>
              <exclude-pattern>*/tests/*</exclude-pattern>
              <exclude-pattern>*/assets/*</exclude-pattern>
              <exclude-pattern>*/languages/*</exclude-pattern>
              <exclude-pattern>*/.git/*</exclude-pattern>
              <exclude-pattern>*/.github/*</exclude-pattern>
              <exclude-pattern>*.js</exclude-pattern>
              <exclude-pattern>*.css</exclude-pattern>

              <!-- Use WordPress VIP Go coding standards -->
              <rule ref="WordPress-VIP-Go">
                  <!-- Allow short array syntax [] instead of array() -->
                  <exclude name="Generic.Arrays.DisallowShortArraySyntax"/>

                  <!-- Allow longer lines for readability in some cases -->
                  <exclude name="Generic.Files.LineLength.TooLong"/>

                  <!-- Exclude JS-related sniffs to avoid deprecation warnings -->
                  <exclude name="WordPressVIPMinimum.JS"/>
              </rule>

              <!-- Add specific WordPressVIPMinimum rules (non-JS) -->
              <rule ref="WordPressVIPMinimum.Security"/>
              <rule ref="WordPressVIPMinimum.Performance"/>
              <rule ref="WordPressVIPMinimum.UserExperience"/>
              <rule ref="WordPressVIPMinimum.Functions"/>
              <rule ref="WordPressVIPMinimum.Variables"/>
              <rule ref="WordPressVIPMinimum.Files"/>
              <rule ref="WordPressVIPMinimum.Hooks"/>

              <!-- WordPress internationalization with plugin text domain -->
              <rule ref="WordPress.WP.I18n">
                  <properties>
                      <property name="text_domain" type="array">
                          <element value="optimizations-ace-mc"/>
                      </property>
                  </properties>
              </rule>

              <!-- Only scan PHP files -->
              <arg name="extensions" value="php"/>

              <!-- Show progress -->
              <arg value="p"/>

              <!-- Show sniff codes in all reports -->
              <arg value="s"/>

              <!-- Use colors in output -->
              <arg name="colors"/>

              <!-- Set report width for better readability -->
              <arg name="report-width" value="120"/>
          </ruleset>
          EOF

      - name: Run WordPress VIP PHPCS
        id: run_wordpress_vip_phpcs
        run: |
          echo "🚀 Running WordPress VIP Go Coding Standards scan..."
          echo "📋 This scan focuses on VIP-specific requirements including:"
          echo "   • File system operation restrictions"
          echo "   • Performance and caching best practices"
          echo "   • Security vulnerabilities specific to VIP platform"
          echo "   • User experience guidelines for enterprise WordPress"
          echo "   • Uncached function usage patterns"
          echo ""
          echo "📦 Using standards: WordPress-VIP-Go, WordPressVIPMinimum"
          echo "🎯 Scanning PHP files only (excluding JS/CSS to avoid deprecation warnings)"
          echo ""

          # Run VIP-specific PHPCS scan using our custom configuration
          # Only scan PHP files to avoid JS/CSS deprecation warnings
          "$VIP_PHPCS" --standard=phpcs-vip.xml --extensions=php . || {
            echo ""
            echo "⚠️ WordPress VIP coding standards issues found."
            echo "💡 Note: These are VIP-specific recommendations for enterprise WordPress platforms."
            echo "🔧 Many of these may not apply to standard WordPress installations."
            echo "📖 For more info: https://docs.wpvip.com/technical-references/code-quality-and-best-practices/"
            echo ""
            exit 1
          }

          echo "✅ WordPress VIP coding standards check completed successfully!"

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            setup_php_8_3=${{ steps.setup_php_8_3.outcome }}
            install_composer_dependencies=${{ steps.install_composer_dependencies.outcome }}
            install_wordpress_vip_coding_standards=${{ steps.install_wordpress_vip_coding_standards.outcome }}
            create_vip_specific_phpcs_configuration=${{ steps.create_vip_specific_phpcs_configuration.outcome }}
            run_wordpress_vip_phpcs=${{ steps.run_wordpress_vip_phpcs.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/optimizations-ace-mc-diagnostics"
          printf '%s\n' "$STEP_RESULTS" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/steps.txt"
          printf 'commit=%s\njob=%s\n' "$GITHUB_SHA" "$GITHUB_JOB" > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/run.txt"
          if command -v php >/dev/null; then
            php -r 'echo PHP_VERSION, PHP_EOL;' > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/php.txt"
          fi
          if command -v composer >/dev/null && [ -f vendor/composer/installed.json ]; then
            php -r '$data = json_decode(file_get_contents("vendor/composer/installed.json"), true, 512, JSON_THROW_ON_ERROR); foreach ($data["packages"] ?? $data as $package) { echo $package["name"], " ", $package["version"], PHP_EOL; }' > "$RUNNER_TEMP/optimizations-ace-mc-diagnostics/dependencies.txt"
          fi
          # Never upload config, authentication data, SQL, exports, or arbitrary logs.
          # Refuse oversized or linked diagnostics instead of uploading them.
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type l -delete
          find "$RUNNER_TEMP/optimizations-ace-mc-diagnostics" -type f -size +2M -delete

      - name: Upload diagnostic summary
        id: upload_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wp-compat-vip-phpcs
          path: |
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/run.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/steps.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/php.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/dependencies.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/wordpress.txt
            ${{ runner.temp }}/optimizations-ace-mc-diagnostics/junit.xml
          retention-days: 7
          if-no-files-found: warn

      - name: Create issue on VIP PHPCS failure
        id: create_issue_on_vip_phpcs_failure
        if: ${{ failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.actor != 'dependabot[bot]' }}
        uses: JasonEtco/create-an-issue@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_STAGE: ${{ steps.checkout_code.outcome == 'failure' && 'checkout_code' || steps.setup_php_8_3.outcome == 'failure' && 'setup_php_8_3' || steps.install_composer_dependencies.outcome == 'failure' && 'install_composer_dependencies' || steps.install_wordpress_vip_coding_standards.outcome == 'failure' && 'install_wordpress_vip_coding_standards' || steps.create_vip_specific_phpcs_configuration.outcome == 'failure' && 'create_vip_specific_phpcs_configuration' || steps.run_wordpress_vip_phpcs.outcome == 'failure' && 'run_wordpress_vip_phpcs' || 'unknown_or_canceled' }}
          PHP_VERSION: '8.3'
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          filename: .github/ISSUE_TEMPLATE/vip-phpcs-failure.md
          update_existing: false

  phpmd:
    name: PHPMD (PHP 8.3)
    runs-on: ubuntu-latest
    # The job files an issue when it fails on main.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 45
    steps:
      - name: Checkout code
        id: checkout_code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Always fetch the latest commit, disable any caching
          fetch-depth: 0
          clean: true

      - name: Verify latest commit
        id: verify_latest_commit
        run: |
          echo "=== Git Information ==="
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Current branch: $(git rev-parse --abbrev-ref HEAD)"
          echo "Latest commit message: $(git log -1 --pretty=%B)"
          echo "=== End Git Information ==="

      - name: Setup PHP 8.3
        id: setup_php_8_3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, curl, zip, intl, gd, mbstring, fileinfo, xml
          coverage: none
          tools: composer:v2

      - name: Clear any existing composer cache
        id: clear_any_existing_composer_cache
        run: |
          composer clear-cache || true
          rm -rf vendor/ composer.lock || true

      - name: Install Composer dependencies (no cache)
        id: install_composer_dependencies_no_cache
        run: |
          composer install --prefer-dist --no-progress --no-cache

      - name: Verify phpmd.xml content
        id: verify_phpmd_xml_content
        run: |
          echo "=== Current phpmd.xml content ==="
          cat phpmd.xml
          echo "=== End phpmd.xml content ==="

      - name: Run PHPMD
        id: run_phpmd
        run: |
          # Use WordPress-specific PHPMD configuration (WordPress snake_case compatible)
          echo "Using WordPress-specific PHPMD configuration (WordPress snake_case compatible)..."
          # The same non-production paths as the exclude patterns in phpmd.xml and as "composer phpmd".
          vendor/bin/phpmd analyze . --no-progress --format text --ruleset phpmd.xml --exclude vendor --exclude tests --exclude stubs --exclude assets --exclude .private --exclude node_modules

      - name: Preserve diagnostic summary
        id: preserve_diagnostics
        if: ${{ always() }}
        continue-on-error: true
        env:
          STEP_RESULTS: |
            checkout_code=${{ steps.checkout_code.outcome }}
            verify_latest_commit=${{ steps.verify_latest_commit.outcome }}
