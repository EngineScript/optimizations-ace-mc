# This workflow automatically posts a guidance comment on new issues.
# It asks for the details maintainers need to troubleshoot a problem with
# Optimizations ACE MC.
# The workflow is triggered whenever a new issue is opened.

name: New Issue Guidance

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  guide:
    runs-on: ubuntu-latest
    # Explicitly define permissions required by the job
    permissions:
      issues: write
    steps:
      - name: Post guidance comment on new issue
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            Thanks for opening an issue. Please describe the problem in detail so that we can reproduce it:

            - The versions of WordPress, PHP, WooCommerce, and (if you use it) WP Store Locator
            - Which settings are enabled under **Settings > ACE MC Optimizations**
            - The steps that lead to the problem, and what you expected to happen
            - Any error messages, from the screen or from the debug log
